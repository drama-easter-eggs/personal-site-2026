*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
#hero{position:relative;height:100vh;height:100svh;overflow:hidden;z-index:1}
body{

#stage{position:absolute;inset:0;overflow:hidden}
.bullet{

#sun{

#qby{

let paused=false, fi=0, rotateTimer=null;

function setQuote(t){

  setTimeout(()=>{
    qtext.textContent = '「' + t + '」';
    qtext.className = t.length>70 ? 'long' : t.length>34 ? 'mid' : '';

}
function startRotate(){

// shuffle-bag so every message appears before repeats
let bag=[];
function nextMsg(){ if(!bag.length) bag = MSGS.map((_,i)=>i).sort(()=>Math.random()-.5); return MSGS[bag.pop()]; }
function short(t){ return t.length>46 ? t.slice(0,44)+'…' : t; }

let lanes=[], laneH=0;
function layout(){
  const H = innerHeight;
  laneH = Math.max(44, Math.min(70, H/13));
  const n = Math.floor((H-40)/laneH);
  lanes = Array.from({length:n},(_,i)=>lanes[i]||{free:0, speed:36+Math.random()*34});
}
function spawn(lane, idx){
  const t = nextMsg();
  const b = document.createElement('button');
  b.className='bullet behind';
  b.type='button';
  b.textContent = short(t);
  b.title = t;
  const size = 15 + Math.random()*11;
  b.style.fontSize = size+'px';
  b.style.top = (20 + idx*laneH + Math.random()*(laneH-size*1.6)) + 'px';
  b.addEventListener('click',()=>{ setQuote(t); startRotate(); });
  stage.appendChild(b);
  const w = b.offsetWidth, W = innerWidth;
  const speed = lane.speed; // px per second, fixed per lane so nothing overtakes
  const dur = (W + w) / speed;
  b.style.setProperty('--from', W+'px');
  b.style.setProperty('--to', (-w)+'px');
  b.style.animation = `fly ${dur}s linear forwards`;
  if(paused) b.style.animationPlayState='paused';
  b.addEventListener('animationend',()=>b.remove());
  // lane frees once tail has entered plus a gap
  lane.free = performance.now() + ((w + 60 + Math.random()*260)/speed)*1000;
}
function tick(){
  const now = performance.now();
  if(!paused) lanes.forEach((l,i)=>{ if(now>l.free) spawn(l,i); });
  requestAnimationFrame(tick);
}
function staticLayout(){ // reduced motion: scatter once
  stage.innerHTML='';
  lanes.forEach((l,i)=>{
    const t=nextMsg(), b=document.createElement('button');
    b.className='bullet'; b.type='button'; b.textContent=short(t); b.title=t;
    b.style.fontSize=(15+Math.random()*9)+'px';
    b.style.top=(20+i*laneH)+'px'; b.style.left=(Math.random()*55)+'vw';
    b.addEventListener('click',()=>setQuote(t));
    stage.appendChild(b);
  });
}

  e.currentTarget.setAttribute('aria-pressed',paused);
});
stage.addEventListener('mouseover',e=>{ if(e.target.classList.contains('bullet')) e.target.style.animationPlayState='paused'; });
stage.addEventListener('mouseout',e=>{ if(e.target.classList.contains('bullet') && !paused) e.target.style.animationPlayState='running'; });
addEventListener('resize',()=>{ layout(); if(reduce) staticLayout(); });

else {
